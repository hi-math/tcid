<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 에이전트 미리보기</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --red: #d8432f;
      --red-deep: #b8321f;
      --ink: #2b2f36;
      --muted: #6b7079;
      --card: #ffffff;
      --tag: #353a42;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--red) url("assets/bg.png") center / cover no-repeat fixed;
      color: var(--ink);
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 4vw;
    }

    /* 카드가 배경 위에서 또렷하게 보이도록 살짝 눌러줌 */
    .stage::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(120, 20, 10, 0.25), rgba(120, 20, 10, 0.05) 70%);
      pointer-events: none;
    }

    .cards {
      position: relative;
      width: min(1600px, 100%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(20px, 2.4vw, 40px);
    }

    .card {
      --i: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: 52px; /* 태그 높이만큼 */
      color: inherit;
      text-decoration: none;
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: calc(.1s + var(--i) * .12s);
    }

    /* 왼쪽 위 사선 타이틀 태그 */
    .tag {
      position: absolute;
      top: 0;
      left: 0;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 44px 0 24px;
      background: var(--tag);
      color: #fff;
      font-size: clamp(16px, 1.3vw, 20px);
      font-weight: 700;
      letter-spacing: .02em;
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 100%, 0 100%);
      transition: background .35s;
    }

    .body {
      background: var(--card);
      box-shadow: 0 10px 30px rgba(90, 15, 5, 0.25);
      overflow: hidden;
      transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: linear-gradient(135deg, #3a3f47, #1d2025);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform .6s cubic-bezier(.2,.8,.2,1);
    }

    /* 썸네일 이미지가 아직 없을 때 */
    .thumb.empty::after {
      content: "썸네일 준비중";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 15px;
      letter-spacing: .1em;
    }

    .info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(20px, 1.8vw, 30px) clamp(22px, 2vw, 34px);
    }

    .title {
      font-size: clamp(20px, 1.6vw, 26px);
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .desc {
      margin-top: 6px;
      font-size: clamp(14px, 1.1vw, 17px);
      color: var(--muted);
    }

    .arrow {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1.5px solid #d9dbe0;
      color: var(--muted);
      font-size: 18px;
      transition: transform .35s cubic-bezier(.2,.8,.2,1), background .35s, border-color .35s, color .35s;
    }

    .card:hover .body,
    .card:focus-visible .body {
      transform: translateY(-8px);
      box-shadow: 0 24px 50px rgba(90, 15, 5, 0.4);
    }

    .card:hover .tag,
    .card:focus-visible .tag { background: var(--red-deep); }

    .card:hover .thumb img,
    .card:focus-visible .thumb img { transform: scale(1.06); }

    .card:hover .arrow,
    .card:focus-visible .arrow {
      transform: rotate(-45deg);
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .card:focus-visible { outline: none; }
    .card:focus-visible .body { outline: 3px solid #fff; outline-offset: 3px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      body { background-attachment: scroll; }
      .cards { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
      .stage { padding: 32px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; }
      .body, .thumb img, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <nav class="cards" aria-label="학교급별 바로가기">
      <a class="card" style="--i:0" href="https://example.com/elementary" target="_blank" rel="noopener">
        <span class="tag">초등학교</span>
        <div class="body">
          <div class="thumb"><img src="assets/thumbs/elementary.png" alt="" onerror="this.parentNode.classList.add('empty'); this.remove()" /></div>
          <div class="info">
            <div>
              <div class="title">AI 에이전트 미리보기</div>
              <div class="desc">초등학교 판</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </div>
      </a>

      <a class="card" style="--i:1" href="https://example.com/middle" target="_blank" rel="noopener">
        <span class="tag">중학교</span>
        <div class="body">
          <div class="thumb"><img src="assets/thumbs/middle.png" alt="" onerror="this.parentNode.classList.add('empty'); this.remove()" /></div>
          <div class="info">
            <div>
              <div class="title">AI 에이전트 미리보기</div>
              <div class="desc">중학교 판</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </div>
      </a>

      <a class="card" style="--i:2" href="https://example.com/high" target="_blank" rel="noopener">
        <span class="tag">고등학교</span>
        <div class="body">
          <div class="thumb"><img src="assets/thumbs/high.png" alt="" onerror="this.parentNode.classList.add('empty'); this.remove()" /></div>
          <div class="info">
            <div>
              <div class="title">AI 에이전트 미리보기</div>
              <div class="desc">고등학교 판</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
