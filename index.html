<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>함께 만드는 수업 서로 깊어지는 배움 - AI 에이전트</title>
  <meta name="description" content="초등·중·고 학교급별 협력적 수업설계 AI 에이전트 - 서울특별시교육청" />
  <!-- 링크 공유 썸네일 (Open Graph) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="함께 만드는 수업 서로 깊어지는 배움 - AI 에이전트" />
  <meta property="og:url" content="https://tcid-three.vercel.app/" />
  <meta property="og:image" content="https://tcid-three.vercel.app/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:description" content="초등·중·고 학교급별 협력적 수업설계 AI 에이전트 - 서울특별시교육청" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-cream: #fceadc;
      --clay-card: #ffffff;
      --clay-thumb-bg: #fcf7f1;
      --ink: #2c2420;
      --muted: #7d7067;
      --orange-accent: #e86338;
      
      /* 클레이 섀도우 */
      --card-shadow: 
        inset 4px 4px 8px rgba(255, 255, 255, 1),
        inset -5px -5px 10px rgba(210, 185, 165, 0.35),
        0 18px 36px rgba(160, 130, 105, 0.18),
        0 6px 14px rgba(160, 130, 105, 0.1);

      --card-shadow-hover: 
        inset 4px 4px 8px rgba(255, 255, 255, 1),
        inset -5px -5px 10px rgba(210, 185, 165, 0.35),
        0 26px 48px rgba(160, 130, 105, 0.28),
        0 10px 20px rgba(160, 130, 105, 0.15);

      --thumb-clay-shadow: 
        inset 3px 3px 6px rgba(195, 170, 150, 0.32),
        inset -3px -3px 6px rgba(255, 255, 255, 0.95),
        0 4px 12px rgba(160, 130, 105, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      height: 100%;
      background-color: var(--bg-cream);
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      position: relative;
    }

    /* 21:9 울트라 와이드 hero 영역 */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      min-height: max(100vh, 640px);
      background-color: var(--bg-cream);
      background-image: url("assets/333.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      /* 좌측 하단 서울특별시교육청 로고를 가리지 않도록 하단 패딩 확보 */
      padding: clamp(40px, 6vh, 80px) clamp(28px, 4.5vw, 72px) clamp(100px, 15vh, 160px);
      box-sizing: border-box;
      overflow: hidden;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    /* 텍스트/카드 가독성을 위한 좌측 약한 밝은 gradient overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(255, 250, 245, 0.25) 0%,
        rgba(255, 250, 245, 0.08) 42%,
        transparent 62%
      );
      z-index: 1;
    }

    .content-wrap {
      position: relative;
      width: min(1040px, 57vw);
      max-width: 100%;
      z-index: 2;
    }

    /* 상단 슬로건 헤더 영역 */
    .header {
      margin-bottom: clamp(20px, 2.5vh, 32px);
      animation: rise .6s cubic-bezier(.16, 1, 0.3, 1) forwards;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      font-size: 13px;
      font-family: "Paperlogy", sans-serif;
      font-weight: 700;
      color: #c9511a;
      background: #ffffff;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 4px rgba(210, 180, 155, 0.25),
        0 4px 10px rgba(180, 140, 110, 0.12);
      margin-bottom: 12px;
      letter-spacing: -.01em;
    }

    .main-title {
      font-family: "Paperlogy", sans-serif;
      font-size: clamp(26px, 2.5vw, 38px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.03em;
      color: #4a2e22; /* 깊고 따뜻한 다크브라운 */
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9), 0 3px 10px rgba(130, 85, 60, 0.14);
      word-break: keep-all;
    }

    .cards {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 1.4vw, 24px);
      align-items: stretch;
    }

    /* 클레이모피즘 카드 본체 */
    .card {
      --i: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
      height: 100%;
      opacity: 0;
      border-radius: 22px;
      background: var(--clay-card);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: var(--card-shadow);
      padding: 0; /* 이중 베젤 방지: 카드 전체를 단일 프레임으로 통일 */
      overflow: hidden;
      animation: rise .6s cubic-bezier(.16, 1, 0.3, 1) forwards;
      animation-delay: calc(.1s + var(--i) * .1s);
      transition: 
        transform .35s cubic-bezier(.34, 1.56, 0.64, 1),
        box-shadow .35s ease;
    }

    /* 상단 일체형 풀 블리드 썸네일 (이중 테두리/베젤 완전 제거) */
    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 600 / 284;
      overflow: hidden;
      background: #f4ece4;
      border: none;
      border-bottom: 1px solid rgba(210, 180, 160, 0.25);
      flex-shrink: 0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      transform: scale(1.06);
      transition: transform .4s cubic-bezier(.25, 1, 0.5, 1);
    }

    /* 중학교 썸네일(2.png)의 여백을 시원하게 채워 모달 중첩 느낌 해소 */
    .card-mid .thumb img {
      transform: scale(1.22);
    }

    /* 썸네일 내부 학교급 배지 (세련된 단일 캡슐 형태) */
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 4px 12px;
      font-size: 11.5px;
      font-family: "Paperlogy", sans-serif;
      font-weight: 700;
      letter-spacing: -.01em;
      color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* 학교급별 배지 컬러 */
    .card-elem .badge {
      background: #f29913; /* 초등 옐로우오렌지 */
    }
    .card-mid .badge {
      background: #479e70; /* 중학 세이지그린 */
    }
    .card-high .badge {
      background: #398cd7; /* 고등 스카이블루 */
    }

    /* 썸네일 이미지가 아직 없을 때 */
    .thumb.empty::after {
      content: "썸네일 준비중";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(160, 130, 105, 0.5);
      font-size: 13px;
      letter-spacing: .06em;
      font-weight: 600;
      font-family: "Paperlogy", sans-serif;
    }

    .info {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 18px; /* 하단 텍스트 영역에만 쾌적한 내부 여백 */
      background: #faf7f4;
      flex: 1;
      transition: background-color .3s ease;
    }

    /* 학교급별 하단 텍스트 영역 은은한 파스텔 틴트 */
    .card-elem .info {
      background: linear-gradient(180deg, rgba(255, 253, 248, 0.8) 0%, rgba(254, 246, 232, 0.65) 100%);
    }
    .card-mid .info {
      background: linear-gradient(180deg, rgba(250, 254, 251, 0.8) 0%, rgba(236, 248, 241, 0.65) 100%);
    }
    .card-high .info {
      background: linear-gradient(180deg, rgba(250, 253, 255, 0.8) 0%, rgba(236, 244, 254, 0.65) 100%);
    }

    /* 학교급별 화살표 포인트 톤온톤 */
    .card-elem .arrow { color: #d97706; }
    .card-mid .arrow { color: #2e7d58; }
    .card-high .arrow { color: #2563eb; }

    .card-elem:hover .arrow { background: #f29913; border-color: #f29913; color: #fff; }
    .card-mid:hover .arrow { background: #479e70; border-color: #479e70; color: #fff; }
    .card-high:hover .arrow { background: #398cd7; border-color: #398cd7; color: #fff; }

    .info-text {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-family: "Paperlogy", sans-serif;
      font-size: clamp(14px, 1.05vw, 16px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.35;
      color: var(--ink);
      word-break: keep-all;
    }

    .desc {
      margin-top: 6px;
      font-size: clamp(11.5px, 0.8vw, 12.5px);
      color: var(--muted);
      line-height: 1.45;
      font-weight: 500;
      word-break: keep-all;
    }

    /* 클레이모피즘 원형 화살표 버튼 */
    .arrow {
      flex: none;
      width: 34px;
      height: 34px;
      margin-top: 2px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff8f2;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 4px rgba(210, 185, 165, 0.4),
        0 4px 10px rgba(160, 130, 105, 0.18);
      color: var(--orange-accent);
      font-size: 14px;
      font-weight: 800;
      transition: all .28s cubic-bezier(.34, 1.56, 0.64, 1);
    }

    /* 카드 호버 인터랙션: 부드러운 리프트 & 미세 줌인 */
    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-shadow-hover);
    }

    .card:hover .badge {
      transform: scale(1.04);
    }

    /* 꽉 찬 이미지에서 아주 조금만 살짝 줌인 */
    .card:hover .thumb img {
      transform: scale(1.09);
    }
    .card-mid:hover .thumb img {
      transform: scale(1.25);
    }

    .card:hover .arrow {
      background: var(--orange-accent);
      color: #ffffff;
      border-color: var(--orange-accent);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.45),
        inset -2px -2px 4px rgba(0, 0, 0, 0.22),
        0 6px 14px rgba(232, 99, 56, 0.4);
      transform: translateX(3px) scale(1.06);
    }

    .card:active {
      transform: translateY(-2px) scale(0.99);
    }

    .card:focus-visible { 
      outline: none; 
      border-color: var(--orange-accent); 
      box-shadow: 0 0 0 3px rgba(232, 99, 56, 0.35); 
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    /* 왼쪽 하단 서울특별시교육청 로고 */
    .footer-logo {
      position: fixed;
      left: clamp(28px, 4.5vw, 68px);
      bottom: clamp(24px, 3.5vh, 44px);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      pointer-events: none;
      user-select: none;
    }

    .footer-logo img {
      height: clamp(34px, 3vw, 44px);
      width: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      filter: drop-shadow(0 2px 5px rgba(180, 140, 110, 0.18));
    }

    /* 오른쪽 하단 AI 생성 이미지 표기 (교육청 로고와 시각적 균형) */
    .ai-notice {
      position: fixed;
      right: clamp(28px, 4.5vw, 68px);
      bottom: clamp(24px, 3.5vh, 44px);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      min-height: clamp(34px, 3vw, 44px);
      font-size: clamp(14px, 1.15vw, 17px);
      font-weight: 300;
      color: rgba(90, 75, 65, 0.85);
      letter-spacing: -.02em;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* 가이드북 & E-BOOK 액션 바 */
    .action-bar {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.2vw, 16px);
      margin-top: clamp(18px, 2.2vh, 26px);
      flex-wrap: wrap;
      animation: rise .6s cubic-bezier(.16, 1, 0.3, 1) forwards;
      animation-delay: .4s;
      opacity: 0;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: clamp(9px, 1.1vh, 12px) clamp(18px, 1.6vw, 24px);
      border-radius: 24px;
      font-family: "Paperlogy", sans-serif;
      font-size: clamp(13px, 0.95vw, 14.5px);
      font-weight: 700;
      letter-spacing: -.02em;
      text-decoration: none;
      box-sizing: border-box;
      white-space: nowrap;
      background: #ffffff;
      color: #3d312a;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 5px rgba(210, 185, 165, 0.3),
        0 6px 14px rgba(160, 130, 105, 0.12);
      transition: 
        transform .22s ease,
        background-color .22s ease,
        color .22s ease,
        box-shadow .22s ease;
    }

    .btn-arrow {
      font-size: 0.95em;
      opacity: 0.7;
      transition: transform .2s ease, opacity .2s ease;
    }

    /* 부드럽고 은은한 호버 피드백 (과하지 않게 완화) */
    .action-btn:hover {
      transform: translateY(-2px);
      background: #fff8f2;
      color: #e86338;
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 5px rgba(210, 185, 165, 0.35),
        0 8px 18px rgba(160, 130, 105, 0.18);
    }

    .action-btn:hover .btn-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .content-wrap {
        width: min(840px, 68vw);
      }
      .hero {
        padding: clamp(40px, 6vh, 70px) 24px clamp(80px, 12vh, 120px);
      }
    }

    @media (max-width: 768px) {
      .hero {
        aspect-ratio: auto;
        min-height: 720px;
        background-position: 65% center;
        justify-content: flex-start;
        align-items: center;
        padding: 50px 20px 60px;
      }
      .content-wrap {
        width: 100%;
        max-width: 440px;
        margin-top: 20px;
      }
      .cards {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
      }
      .main-title {
        text-align: center;
      }
      .header-badge {
        display: table;
        margin-left: auto;
        margin-right: auto;
      }
      .action-bar {
        justify-content: center;
        width: 100%;
        margin-top: 20px;
      }
      .action-btn {
        flex: 1 1 calc(50% - 8px);
        justify-content: center;
      }
      .footer-logo {
        position: relative;
        left: auto;
        bottom: auto;
        margin-top: 36px;
        justify-content: center;
        width: 100%;
      }
      .footer-logo img {
        height: 32px;
      }
      .ai-notice {
        position: relative;
        right: auto;
        bottom: auto;
        margin-top: 16px;
        text-align: center;
        width: 100%;
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .header, .action-bar { animation: none; opacity: 1; transition: none; }
      .thumb img, .arrow, .badge, .action-btn { transition: none; }
    }
  </style>
</head>
<body>
  <!-- 21:9 울트라 와이드 hero 섹션 -->
  <main class="hero">
    <div class="content-wrap">
      <!-- 상단 슬로건 텍스트 -->
      <header class="header">
        <span class="header-badge">협력적 수업설계 AI 에이전트</span>
        <h1 class="main-title">함께 만드는 수업<br>서로 깊어지는 배움</h1>
      </header>

      <!-- 3D 클레이모피즘 바로가기 카드들 -->
      <nav class="cards" aria-label="학교급별 바로가기">
        <a class="card card-elem" style="--i:0" href="https://togethertr.web.app/" target="_blank" rel="noopener">
          <div class="thumb">
            <span class="badge">초등학교</span>
            <img src="assets/1.png?v=2" alt="초등학교 AI 에이전트" onerror="this.parentNode.classList.add('empty'); this.remove()" />
          </div>
          <div class="info">
            <div class="info-text">
              <div class="title">교과를 잇는 통합 수업 설계</div>
              <div class="desc">담임 교사가 여러 교과를 연결해 배움의 흐름을 만듭니다.</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a class="card card-mid" style="--i:1" href="https://teaching-designer.vercel.app/" target="_blank" rel="noopener">
          <div class="thumb">
            <span class="badge">중학교</span>
            <img src="assets/2.png?v=2" alt="중학교 AI 에이전트" onerror="this.parentNode.classList.add('empty'); this.remove()" />
          </div>
          <div class="info">
            <div class="info-text">
              <div class="title">교과 전문가의 협력적 수업 설계</div>
              <div class="desc">여러 교과 교사가 함께 프로젝트 수업을 기획하고 의견을 나눕니다.</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a class="card card-high" style="--i:2" href="https://curriculum-weaver.vercel.app/guide" target="_blank" rel="noopener">
          <div class="thumb">
            <span class="badge">고등학교</span>
            <img src="assets/3.png?v=2" alt="고등학교 AI 에이전트" onerror="this.parentNode.classList.add('empty'); this.remove()" />
          </div>
          <div class="info">
            <div class="info-text">
              <div class="title">성취기준 기반 맞춤 수업 설계</div>
              <div class="desc">과목과 진로를 연결해 깊이 있는 배움의 경험을 설계합니다.</div>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </nav>

      <!-- 가이드북 다운로드 및 E-BOOK 보기 버튼 바 -->
      <div class="action-bar">
        <a class="action-btn" href="https://onlinebooks.co.kr/books/tcid/#p=1" target="_blank" rel="noopener">
          <span>E-BOOK 보기</span>
